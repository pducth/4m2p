<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chia tiền nhóm</title>
<style>
  :root{--bg:#f3f4fb;--card:#fff;--text:#1b2033;--muted:#7a8199;--pri:#6366f1;--pri2:#8b5cf6;--ok:#10b981;--okbg:#d1fae5;--bad:#ef4444;--badbg:#fee2e2;--line:#eceef6;--shadow:0 4px 18px rgba(60,70,130,.08)}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1118;--card:#171b26;--text:#eaedf6;--muted:#8b93ab;--line:#242a3a;--okbg:#06382b;--badbg:#431a1a;--shadow:0 4px 18px rgba(0,0,0,.35)}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
  h1{font-size:22px;margin:0}
  .muted{color:var(--muted);font-size:14px}
  .hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;margin:0 -16px;padding:22px 16px 56px;border-radius:0 0 28px 28px}
  .hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .hero .who{display:flex;align-items:center;gap:12px}
  .hero .sub{opacity:.85;font-size:14px}
  .hero button.ghost{background:rgba(255,255,255,.18);color:#fff;border:0;padding:8px 14px;font-size:14px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:-36px 0 6px}
  .stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .stat .lbl{font-size:13px;color:var(--muted)}
  .stat .val{font-size:20px;font-weight:800;margin-top:2px}
  .recv{color:var(--ok)}.total{color:var(--bad)}
  .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .av.sm{width:34px;height:34px;font-size:14px}
  .av.lg{width:64px;height:64px;font-size:26px}
  .card{background:var(--card);border-radius:18px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
  .banner{background:#fef3c7;color:#78350f;border-radius:12px;padding:10px 12px;font-size:14px;margin:14px 0}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:600;transition:transform .08s,opacity .15s}
  button:active{transform:scale(.97)}
  .tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:14px;box-shadow:var(--shadow);margin:14px 0}
  .tabs button{flex:1;background:transparent;color:var(--muted);padding:10px 4px;font-size:14px;font-weight:600;border-radius:11px}
  .tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
  .pick{padding-top:48px;text-align:center}
  .pick h1{font-size:26px}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
  button.name{background:var(--card);color:var(--text);box-shadow:var(--shadow);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:16px}
  .person{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .person .nm{flex:1;font-weight:700}
  .person .sum{font-weight:800;font-size:17px}
  .debt{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .debt .info{flex:1;min-width:0}
  .debt .amt{font-weight:700;white-space:nowrap}
  .debt input[type=checkbox]{appearance:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--bg)}
  .debt input[type=checkbox]:hover{border-color:var(--ok)}
  .debt input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
  .debt input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:16px;font-weight:700}
  .actions{display:flex;gap:8px;margin:4px 0 8px}
  .actions button{flex:1;padding:10px 8px;font-size:14px}
  .actions button.ok{flex:2;background:var(--ok)}
  .actions button.alt{background:var(--bg);color:var(--pri);border:2px solid var(--line)}
  details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0;list-style:none}
  details summary::before{content:"▸ "}
  details[open] summary::before{content:"▾ "}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  label.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
  label.chk:has(input:checked){border-color:var(--pri);background:rgba(99,102,241,.08)}
  label.chk input{width:18px;height:18px;accent-color:var(--pri)}
  input[type=text]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);outline:none}
  input[type=text]:focus{border-color:var(--pri)}
  .amount-in{font-size:24px;font-weight:800}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .row input[type=text]{width:130px}
  .seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin:14px 0}
  .seg button{flex:1;background:transparent;color:var(--muted);padding:9px;font-size:14px}
  .seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
  .preview{font-size:14px;margin:10px 0 14px;padding:10px 12px;background:var(--bg);border-radius:12px;color:var(--muted);min-height:20px}
  .empty{text-align:center;color:var(--muted);padding:34px 0}
  .empty .big{font-size:40px}
  .sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ================== CẤU HÌNH ================== */
// Dán config Firebase của bạn vào đây (xem README.md). Để trống = chạy thử, chỉ lưu trên máy này.
const firebaseConfig = {
  apiKey: "AIzaSyD5s7ny-jOe0QeLbDZqc8NdLGNClnHAmK8",
  authDomain: "m2p-56de3.firebaseapp.com",
  databaseURL: "https://m2p-56de3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "m2p-56de3",
  appId: "1:192127596312:web:9f693946732cd98746906d"
};
const MEMBERS = ["Thiện", "Phúc", "Quyền", "Linh", "Anh", "Thụy"];
/* ============================================== */

const useFirebase = !!firebaseConfig.databaseURL;
let db = null, debts = {}, me = null, tab = "owed", draft = null;
try { me = localStorage.getItem("me"); } catch (e) {}
if (!MEMBERS.includes(me)) me = null;

/* ---------- Lưu trữ ---------- */
function localLoad(){ try { return JSON.parse(localStorage.getItem("debts") || "{}"); } catch(e){ return {}; } }
function localSave(){ try { localStorage.setItem("debts", JSON.stringify(debts)); } catch(e){} }

if (useFirebase) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database().ref("debts");
  db.on("value", s => { debts = s.val() || {}; render(); });
} else {
  debts = localLoad();
}
function addDebts(list){
  list.forEach(d => {
    if (useFirebase) db.push(d);
    else debts["l" + Date.now() + Math.random().toString(36).slice(2,6)] = d;
  });
  if (!useFirebase) { localSave(); render(); }
}
function removeDebt(id){
  if (useFirebase) db.child(id).remove();
  else { delete debts[id]; localSave(); render(); }
}
function setDebtAmount(id, amount){
  if (useFirebase) db.child(id).update({amount});
  else { debts[id].amount = amount; localSave(); render(); }
}
function settleAll(name){
  const list = mine("creditor").filter(([,d]) => d.debtor === name);
  const sum = list.reduce((s,[,d]) => s + d.amount, 0);
  if (!list.length || !confirm(`Xác nhận ${name} đã trả hết ${fmt(sum)} (${list.length} khoản)?`)) return;
  list.forEach(([id]) => removeDebt(id));
}
function settlePartial(name){
  const list = mine("creditor").filter(([,d]) => d.debtor === name); // cũ nhất trước
  const sum = list.reduce((s,[,d]) => s + d.amount, 0);
  const v = prompt(`${name} đang nợ ${fmt(sum)}. Nhập số tiền đã nhận (vd 50k):`);
  if (v === null) return;
  let left = parseMoney(v);
  if (!left) { alert("Số tiền không hợp lệ."); return; }
  if (left > sum) { alert(`Vượt quá số nợ (${fmt(sum)}).`); return; }
  for (const [id,d] of list) {
    if (left <= 0) break;
    if (left >= d.amount) { left -= d.amount; removeDebt(id); }
    else { setDebtAmount(id, d.amount - left); left = 0; }
  }
}

/* ---------- Tiện ích ---------- */
const fmt = n => n.toLocaleString("vi-VN") + "đ";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseMoney(v){
  v = String(v).trim().toLowerCase().replace(/[.,\s]/g, "");
  let m = v.match(/^(\d+)(k|tr|m)?$/);
  if (!m) return 0;
  let n = parseInt(m[1], 10);
  if (m[2] === "k") n *= 1000;
  else if (m[2] === "tr" || m[2] === "m") n *= 1000000;
  return n;
}
function newDraft(){ return { amount:"", note:"", mode:"equal", sel:{}, custom:{} }; }
function mine(role){ // role: 'creditor' | 'debtor'
  return Object.entries(debts).filter(([,d]) => d[role] === me).sort((a,b) => a[1].createdAt - b[1].createdAt);
}
function groupBy(list, key){
  const g = {};
  list.forEach(([id,d]) => (g[d[key]] = g[d[key]] || []).push([id,d]));
  return g;
}

/* ---------- Giao diện ---------- */
function render(){
  const app = document.getElementById("app");
  if (!me) { app.innerHTML = pickView(); return; }
  if (!draft) draft = newDraft();
  const owedTotal = mine("creditor").reduce((s,[,d]) => s + d.amount, 0);
  const oweTotal  = mine("debtor").reduce((s,[,d]) => s + d.amount, 0);
  app.innerHTML = `
    <div class="hero"><div class="top">
      <div class="who">${avatar(me)}<div><h1>Chào ${esc(me)} 👋</h1><div class="sub">Quản lý tiền chia nhóm</div></div></div>
      <button class="ghost" onclick="switchUser()">Đổi tên</button>
    </div></div>
    <div class="stats">
      <div class="stat"><div class="lbl">Bạn cần đòi</div><div class="val recv">${fmt(owedTotal)}</div></div>
      <div class="stat"><div class="lbl">Bạn phải trả</div><div class="val total">${fmt(oweTotal)}</div></div>
    </div>
    ${useFirebase ? "" : `<div class="banner">Chế độ chạy thử: dữ liệu chỉ lưu trên máy này. Dán config Firebase để cả nhóm cùng xem (xem README.md).</div>`}
    <div class="tabs">
      <button class="${tab==="owed"?"on":""}" onclick="setTab('owed')">Tôi cần đòi</button>
      <button class="${tab==="owe"?"on":""}" onclick="setTab('owe')">Tôi cần trả</button>
      <button class="${tab==="add"?"on":""}" onclick="setTab('add')">+ Chia tiền</button>
    </div>
    ${tab==="owed" ? owedView() : tab==="owe" ? oweView() : addView()}
  `;
}
function pickView(){
  return `<div class="pick"><div style="font-size:48px">💸</div><h1>Chia tiền nhóm</h1><div class="muted">Bạn là ai?</div>
    ${useFirebase ? "" : `<div class="banner">Chế độ chạy thử: chưa cấu hình Firebase.</div>`}
    <div class="names">${MEMBERS.map(n => `<button class="name" onclick="pick('${n}')">${avatar(n,"lg")}${n}</button>`).join("")}</div></div>`;
}
const COLORS = ["#6366f1","#ec4899","#f59e0b","#10b981","#06b6d4","#ef4444"];
function avatar(n, size){
  const c = COLORS[Math.max(0, MEMBERS.indexOf(n)) % COLORS.length];
  return `<div class="av ${size||""}" style="background:${c}">${esc(n.charAt(0))}</div>`;
}
function owedView(){
  const g = groupBy(mine("creditor"), "debtor");
  const names = Object.keys(g);
  if (!names.length) return `<div class="card empty"><div class="big">🎉</div>Không ai nợ bạn</div>`;
  return names.map(n => {
    const sum = g[n].reduce((s,[,d]) => s + d.amount, 0);
    return `<div class="card"><div class="person">${avatar(n,"sm")}<span class="nm">${esc(n)} nợ bạn</span><span class="sum recv">${fmt(sum)}</span></div>
      <div class="actions">
        <button class="ok" onclick="settleAll('${n}')">✓ ${esc(n)} đã trả hết</button>
        <button class="alt" onclick="settlePartial('${n}')">Trả một phần</button>
      </div>
      <details><summary>Xem ${g[n].length} khoản</summary>
      ${g[n].map(([id,d]) => `<div class="debt">
        <input type="checkbox" title="Đã trả" onchange="markPaid('${id}')">
        <div class="info"><div>${esc(d.note || "(không ghi chú)")}</div><div class="muted">${new Date(d.createdAt).toLocaleDateString("vi-VN")}</div></div>
        <div class="amt">${fmt(d.amount)}</div></div>`).join("")}
      <div class="hint">Cần xoá riêng một khoản thì tick ô vuông bên trái khoản đó.</div></details></div>`;
  }).join("");
}
function oweView(){
  const g = groupBy(mine("debtor"), "creditor");
  const names = Object.keys(g);
  if (!names.length) return `<div class="card empty"><div class="big">🎉</div>Bạn không nợ ai</div>`;
  return names.map(n => {
    const sum = g[n].reduce((s,[,d]) => s + d.amount, 0);
    return `<div class="card"><div class="person">${avatar(n,"sm")}<span class="nm">Trả cho ${esc(n)}</span><span class="sum total">${fmt(sum)}</span></div>
      ${g[n].map(([,d]) => `<div class="debt">
        <div class="info"><div>${esc(d.note || "(không ghi chú)")}</div><div class="muted">${new Date(d.createdAt).toLocaleDateString("vi-VN")}</div></div>
        <div class="amt">${fmt(d.amount)}</div></div>`).join("")}
      <div class="hint">${esc(n)} sẽ tick xoá khi nhận được tiền.</div></div>`;
  }).join("");
}
function addView(){
  const d = draft;
  const picked = MEMBERS.filter(n => d.sel[n]);
  return `<div class="card">
    <div class="person">${avatar(me,"sm")}<span class="nm">${esc(me)} <span class="muted">là người trả tiền</span></span></div>
    <input type="text" class="amount-in" id="amount" inputmode="text" placeholder="Tổng tiền, vd: 120k hoặc 120000" value="${esc(d.amount)}" oninput="onAmount(this.value)">
    <div style="height:8px"></div>
    <input type="text" id="note" placeholder="Ghi chú, vd: ăn trưa" value="${esc(d.note)}" oninput="draft.note=this.value">
    <div class="sec-title">Chia cho ai? <span style="text-transform:none;font-weight:400">(tick cả bạn nếu bạn cũng có phần)</span></div>
    <div class="grid">${MEMBERS.map(n => `<label class="chk"><input type="checkbox" ${d.sel[n]?"checked":""} onchange="toggleSel('${n}',this.checked)"> ${n}${n===me?" (tôi)":""}</label>`).join("")}</div>
    <div class="seg">
      <button class="${d.mode==="equal"?"on":""}" onclick="setMode('equal')">Chia đều</button>
      <button class="${d.mode==="custom"?"on":""}" onclick="setMode('custom')">Tự nhập từng người</button>
    </div>
    ${d.mode==="custom" ? picked.map(n => `<div class="row">${avatar(n,"sm")}<span style="flex:1;font-weight:600">${n}</span>
      <input type="text" inputmode="text" placeholder="vd 50k" value="${esc(d.custom[n]||"")}" oninput="onCustom('${n}',this.value)"></div>`).join("") : ""}
    <div class="preview" id="preview">${previewText()}</div>
    <button onclick="submitSplit()" style="width:100%">Lưu khoản chia</button>
  </div>`;
}
function computeShares(){
  const d = draft, picked = MEMBERS.filter(n => d.sel[n]), total = parseMoney(d.amount), shares = {};
  if (d.mode === "equal") {
    if (!picked.length || !total) return {shares, total, ok:false, msg:"Nhập số tiền và chọn người."};
    const base = Math.floor(total / picked.length); let rem = total - base * picked.length;
    picked.forEach(n => { shares[n] = base + (rem-- > 0 ? 1 : 0); });
    return {shares, total, ok:true};
  }
  picked.forEach(n => shares[n] = parseMoney(d.custom[n] || ""));
  const sum = Object.values(shares).reduce((a,b) => a+b, 0);
  if (!picked.length) return {shares, total:sum, ok:false, msg:"Chọn người cần chia."};
  if (total && sum !== total) return {shares, total:sum, ok:false, msg:`Tổng từng người ${fmt(sum)} ≠ tổng tiền ${fmt(total)} (lệch ${fmt(Math.abs(total-sum))}).`};
  if (!sum) return {shares, total:sum, ok:false, msg:"Nhập số tiền từng người."};
  return {shares, total:sum, ok:true};
}
function previewText(){
  const r = computeShares();
  const lines = Object.entries(r.shares).map(([n,v]) => `${n}: ${fmt(v)}`).join(" · ");
  return (lines || "") + (r.msg ? `<br><span style="color:var(--bad)">${r.msg}</span>` : "");
}
function updatePreview(){ const p = document.getElementById("preview"); if (p) p.innerHTML = previewText(); }

/* ---------- Hành động ---------- */
function pick(n){ me = n; try { localStorage.setItem("me", n); } catch(e){} tab = "owed"; render(); }
function switchUser(){ me = null; render(); }
function setTab(t){ tab = t; render(); }
function onAmount(v){ draft.amount = v; updatePreview(); }
function onCustom(n,v){ draft.custom[n] = v; updatePreview(); }
function toggleSel(n,c){ draft.sel[n] = c; render(); }
function setMode(m){ draft.mode = m; render(); }
function markPaid(id){
  const d = debts[id];
  if (d && confirm(`Xác nhận ${d.debtor} đã trả ${fmt(d.amount)}?`)) removeDebt(id);
  else render();
}
function submitSplit(){
  const r = computeShares();
  if (!r.ok) { alert(r.msg); return; }
  const now = Date.now();
  const list = Object.entries(r.shares)
    .filter(([n,v]) => n !== me && v > 0)
    .map(([n,v]) => ({creditor: me, debtor: n, amount: v, note: draft.note.trim(), createdAt: now}));
  if (!list.length) { alert("Không có ai nợ bạn trong khoản này."); return; }
  addDebts(list);
  draft = newDraft(); tab = "owed"; render();
}
render();
</script>
</body>
</html>
